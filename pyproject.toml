[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime-quality-platform"
version = "0.6.0.dev0"
description = "Provider-neutral Agent runtime with durable checkpoints and regression gates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
postgres = ["psycopg[binary]>=3.2,<4", "psycopg-pool>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["integration: optional cross-project integration tests"]
