name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run unit and contract tests
        run: >-
          python -m pytest -m "not integration"
          --basetemp .pytest-tmp-unit
          --junitxml reports/unit-and-contract.xml

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-and-contract-report
          path: reports/unit-and-contract.xml
          if-no-files-found: error

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: runtime_test
          POSTGRES_USER: runtime_test
          POSTGRES_PASSWORD: integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runtime_test -d runtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RUNTIME_DATABASE_URL: postgresql://runtime_test:integration-only@localhost:5432/runtime_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install PostgreSQL test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Exercise migration, pool lifecycle, and lease takeover
        run: >-
          python -m pytest tests/integration/test_postgres_runtime_backend.py
          --basetemp .pytest-tmp-postgres
          --junitxml reports/postgres-integration.xml

      - name: Upload PostgreSQL integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-integration-report
          path: reports/postgres-integration.xml
          if-no-files-found: error
